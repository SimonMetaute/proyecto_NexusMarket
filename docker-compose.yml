version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: nexusmarket-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: nexusmarket
      MYSQL_USER: nexus_user
      MYSQL_PASSWORD: nexus_pass
    ports:
      - "3306:3306"
    volumes:
      - nexusmarket_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-db:
    image: mongo:7
    container_name: nexusmarket-mongo
    environment:
      MONGO_INITDB_DATABASE: audit_db
    ports:
      - "27017:27017"
    volumes:
      - nexusmarket_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5

  market-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusmarket-api
    depends_on:
      mysql-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MYSQL_HOST: mysql-db
      MYSQL_PORT: 3306
      MYSQL_USER: nexus_user
      MYSQL_PASSWORD: nexus_pass
      MYSQL_DATABASE: nexusmarket
      MONGO_URI: mongodb://mongo-db:27017/audit_db
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN_SECONDS: 3600
      BCRYPT_SALT_ROUNDS: 10
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    container_name: nexusmarket-frontend
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - market-api
    restart: unless-stopped

volumes:
  nexusmarket_mysql_data:
  nexusmarket_mongo_data:
